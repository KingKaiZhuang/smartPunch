<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>編輯資料</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <!-- Apple Minimalist Navbar -->
    <div class="navbar">
        <a href="{{ url_for('admin_panel') }}" class="navbar-brand">打卡系統</a>
        <div class="navbar-nav">
            <a href="{{ url_for('admin_panel') }}" class="nav-link">返回主頁</a>
        </div>
    </div>

    <div class="container" style="max-width: 600px;">
        {% if record and record.serial_no %}
        <h1 style="font-size: 32px;">編輯資料 <span style="color: var(--apple-text-secondary); font-size: 24px;">#{{ record.serial_no }}</span></h1>
        {% else %}
        <h1 style="font-size: 32px;">新增紀錄</h1>
        {% endif %}
        
        <div class="card" style="margin-top: 30px;">
            <form method="POST">
                <!-- 基本資料 -->
                <div class="form-group">
                    <label class="form-label" for="name">姓名</label>
                    <input type="text" id="name" name="name" value="{{ record.name or '' }}" placeholder="請輸入姓名">
                </div>

                <div class="form-group">
                    <label class="form-label" for="id_number">身分證號</label>
                    <input type="text" id="id_number" name="id_number" value="{{ record.id_number or '' }}" 
                           placeholder="格式：A123456789"
                           pattern="^[A-Z]{1}[0-9]{9}$"
                           maxlength="10"
                           inputmode="latin"
                           title="請輸入有效的身分證字號（1 個大寫英文 + 9 位數字）"
                           {% if record and record.serial_no %}readonly style="background-color: #f5f5f7; color: var(--apple-text-secondary);"{% endif %}>
                </div>

                <!-- 時間資訊 -->
                <div class="form-group">
                    <label class="form-label" for="service_start">開始時間</label>
                    <input type="datetime-local" id="service_start" name="service_start" 
                           value="{{ record.service_start.strftime('%Y-%m-%dT%H:%M') if record.service_start else '' }}">
                </div>

                <div class="form-group">
                    <label class="form-label" for="service_end">結束時間</label>
                    <input type="datetime-local" id="service_end" name="service_end" 
                           value="{{ record.service_end.strftime('%Y-%m-%dT%H:%M') if record.service_end else '' }}">
                </div>

                <!-- 服務資訊 -->
                <div class="form-group">
                    <label class="form-label" for="service_item">服務項目</label>
                    <input type="text" id="service_item" name="service_item" value="{{ record.service_item or '' }}" placeholder="請輸入服務項目">
                </div>

                <div class="form-group">
                    <label class="form-label" for="service_content">服務內容</label>
                    <input type="text" id="service_content" name="service_content" value="{{ record.service_content or '' }}" placeholder="請輸入服務內容">
                </div>

                <!-- 時間統計 -->
                <div style="display: flex; gap: 15px;">
                    <div class="form-group" style="flex: 1;">
                        <label class="form-label" for="service_hours">服務時數</label>
                        <input type="number" id="service_hours" name="service_hours" min="0" value="{{ record.service_hours or 0 }}" 
                               {% if record and record.serial_no %}readonly style="background-color: #f5f5f7; color: var(--apple-text-secondary);"{% endif %}>
                    </div>

                    <div class="form-group" style="flex: 1;">
                        <label class="form-label" for="service_minutes">服務分鐘</label>
                        <input type="number" id="service_minutes" name="service_minutes" min="0" max="59" value="{{ record.service_minutes or 0 }}" 
                               {% if record and record.serial_no %}readonly style="background-color: #f5f5f7; color: var(--apple-text-secondary);"{% endif %}>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="served_people_count">服務人數</label>
                    <input type="number" id="served_people_count" name="served_people_count" min="0" value="{{ record.served_people_count or 0 }}">
                </div>

                <!-- 費用資訊 -->
                <div style="display: flex; gap: 15px;">
                    <div class="form-group" style="flex: 1;">
                        <label class="form-label" for="transport_fee">交通費</label>
                        <input type="number" id="transport_fee" name="transport_fee" min="0" value="{{ record.transport_fee or 0 }}">
                    </div>

                    <div class="form-group" style="flex: 1;">
                        <label class="form-label" for="meal_fee">餐費</label>
                        <input type="number" id="meal_fee" name="meal_fee" min="0" value="{{ record.meal_fee or 0 }}">
                    </div>
                </div>

                <!-- 其他資訊 -->
                <div class="form-group">
                    <label class="form-label" for="service_area">服務地區</label>
                    <input type="text" id="service_area" name="service_area" value="{{ record.service_area or '' }}" placeholder="請輸入服務地區">
                </div>

                <div class="form-group">
                    <label class="form-label" for="remarks">備註</label>
                    <input type="text" id="remarks" name="remarks" value="{{ record.remarks or '' }}" placeholder="請輸入備註">
                </div>

                <div class="form-group">
                    <label class="form-label" for="import_action">匯入行為</label>
                    <input type="text" id="import_action" name="import_action" value="{{ record.import_action or '' }}" placeholder="請輸入匯入行為">
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="serial_number">序號</label>
                    <input type="text" id="serial_number" name="serial_number" value="{{ record.serial_number or '' }}" placeholder="輸入序號（英文和數字）" pattern="[a-zA-Z0-9]+" title="只能輸入英文字母和數字">
                </div>
                
                <!-- 服務次數統計 -->
                <div style="display: flex; gap: 15px;">
                    <div class="form-group" style="flex: 1;">
                        <label class="form-label" for="foreign_service_count">境外服務次數</label>
                        <input type="number" id="foreign_service_count" name="foreign_service_count" min="0" value="{{ record.foreign_service_count or 0 }}">
                    </div>

                    <div class="form-group" style="flex: 1;">
                        <label class="form-label" for="domestic_service_count">國內服務次數</label>
                        <input type="number" id="domestic_service_count" name="domestic_service_count" min="0" value="{{ record.domestic_service_count or 0 }}">
                    </div>
                </div>

                <!-- 按鈕區 -->
                <div style="display: flex; gap: 15px; margin-top: 30px;">
                    <button type="submit" class="btn btn-primary" style="flex: 1; padding: 12px; font-size: 16px;">儲存修改</button>
                    <a href="{{ url_for('admin_panel') }}" class="btn btn-secondary" style="flex: 1; padding: 12px; font-size: 16px;">取消</a>
                </div>
            </form>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 1. 取得需要互動的 HTML 元素
            const startInput = document.getElementById('service_start');
            const endInput = document.getElementById('service_end');
            const hoursInput = document.getElementById('service_hours');
            const minutesInput = document.getElementById('service_minutes');
            const submitBtn = document.querySelector('button[type="submit"]');
            const form = document.querySelector('form');

            // 2. 建立計算時間的函式
            function calculateTime() {
                const startVal = startInput.value;
                const endVal = endInput.value;

                // 確保兩個時間都有填寫才進行計算
                if (startVal && endVal) {
                    const startTime = new Date(startVal);
                    const endTime = new Date(endVal);

                    // 計算相差的毫秒數
                    let diffInMs = endTime - startTime;
                    
                    // ✦ 檢查下班時間是否早於上班時間
                    if (diffInMs < 0) {
                        hoursInput.value = 0;
                        minutesInput.value = 0;
                        submitBtn.disabled = true;
                        submitBtn.style.opacity = '0.5';
                        submitBtn.style.cursor = 'not-allowed';
                        submitBtn.title = '❌ 下班時間不能早於上班時間！';
                        return;
                    }

                    // 恢復提交按鈕
                    submitBtn.disabled = false;
                    submitBtn.style.opacity = '1';
                    submitBtn.style.cursor = 'pointer';
                    submitBtn.title = '點擊儲存修改';

                    // 將毫秒轉換為總分鐘數
                    let totalMinutes = Math.floor(diffInMs / (1000 * 60));

                    // 正常計算小時和分鐘
                    let hours = Math.floor(totalMinutes / 60);
                    let minutes = totalMinutes % 60;

                    // 將結果填入唯讀的輸入框中
                    hoursInput.value = hours;
                    minutesInput.value = minutes;
                }
            }

            // 3. 提交表單時的驗證
            form.addEventListener('submit', function(e) {
                const startVal = startInput.value;
                const endVal = endInput.value;

                if (startVal && endVal) {
                    const startTime = new Date(startVal);
                    const endTime = new Date(endVal);
                    const diffInMs = endTime - startTime;

                    if (diffInMs < 0) {
                        e.preventDefault();
                        alert('❌ 下班時間不能早於上班時間！\n\n上班時間：' + startInput.value + '\n下班時間：' + endInput.value);
                        return false;
                    }
                }
            });

            // 4. 監聽開始與結束時間的變動，一有改變就執行 calculateTime
            startInput.addEventListener('change', calculateTime);
            endInput.addEventListener('change', calculateTime);
        });

        // 身分證輸入驗證：只能輸入英數，自動大寫
        document.addEventListener('DOMContentLoaded', function() {
            const idInput = document.querySelector('input[name="id_number"]');
            if (idInput && !idInput.hasAttribute('readonly')) {
                idInput.addEventListener('input', (e) => {
                    e.target.value = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
                });
            }
        });
    </script>
</body>
</html>
