<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理員登入</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="auth-container">
        <h1 style="font-size: 32px;">管理員登入</h1>
        <div class="card" style="padding: 40px;">
            <form method="POST" autocomplete="off">
                <div class="form-group" style="margin-bottom: 20px;">
                    <label class="form-label" for="username">帳號</label>
                    <input 
                        type="text" 
                        id="username" 
                        name="username" 
                        required
                        autocomplete="off"
                        placeholder="請輸入帳號"
                    >
                </div>
                <div class="form-group" style="margin-bottom: 30px;">
                    <label class="form-label" for="password">密碼</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        required
                        autocomplete="new-password"
                        placeholder="請輸入密碼"
                    >
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; font-size: 16px; padding: 12px;">登入</button>
            </form>
            
            {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
            <div style="margin-top: 20px;">
                {% for category, msg in messages %}
                <div class="badge {% if category == 'success' %}badge-info{% endif %}" style="display: block; text-align: left; background-color: {% if category == 'success' %}#e5f0fb{% else %}#ffebe9{% endif %}; color: {% if category == 'success' %}var(--apple-blue){% else %}var(--apple-red){% endif %}; font-size: 14px; padding: 12px; margin-bottom: 10px;">
                    {{ msg }}
                </div>
                {% endfor %}
            </div>
            {% endif %}
            {% endwith %}

            <div style="margin: 25px 0; color: var(--apple-text-secondary); font-size: 14px;">或</div>
            
            <div>
                <a href="{{ url_for('register') }}" style="font-size: 14px; font-weight: 500;">註冊新使用者</a>
            </div>
        </div>
    </div>

    <script>
        // 清除自動填充的值（可選）
        window.addEventListener('load', function() {
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
        });
    </script>
</body>
</html>
