<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QRCode 產生器</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #0d6efd;
            --secondary-color: #0b5ed7;
            --success-color: #198754;
        }

        * {
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #f8f9fa, #e9ecef);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", "微軟正黑體", Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
        }

        .card {
            border-radius: 20px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);
            padding: 30px;
            background: white;
            max-width: 1000px;
        }

        @media (max-width: 768px) {
            .card {
                padding: 20px;
                border-radius: 15px;
            }
        }

        .btn-custom {
            background: var(--primary-color);
            color: white;
            border-radius: 10px;
            font-size: 1.1rem;
            padding: 12px 0;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .btn-custom:hover {
            background: var(--secondary-color);
            box-shadow: 0 4px 12px rgba(13, 110, 253, 0.3);
            transform: translateY(-2px);
        }

        .btn-custom:active {
            transform: translateY(0);
        }

        .qr-area {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 300px;
        }

        img {
            max-width: 260px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .small-note {
            font-size: 1rem;
            color: #6c757d;
        }

        .form-section {
            border-right: 1px solid #dee2e6;
            padding-right: 40px;
        }

        @media (max-width: 768px) {
            .form-section {
                border-right: none;
                border-bottom: 1px solid #dee2e6;
                padding-right: 0;
                padding-bottom: 20px;
                margin-bottom: 20px;
            }
        }

        .form-label {
            font-size: 1rem;
            font-weight: 600;
            color: #333;
        }

        input.form-control {
            font-size: 1rem;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            transition: all 0.3s ease;
        }

        input.form-control:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(13, 110, 253, 0.1);
        }

        h2 {
            font-size: 2rem;
            font-weight: 600;
            margin: 0;
        }

        .success-name {
            font-weight: 600;
            color: var(--success-color);
        }

        .alert {
            border-radius: 6px;
            padding: 12px;
            margin-top: 15px;
        }

        .alert-warning {
            background-color: #fff3cd;
            border: 1px solid #ffc107;
            color: #856404;
        }

        .alert p {
            margin: 0;
        }

        .d-flex {
            display: flex;
        }

        .justify-content-between {
            justify-content: space-between;
        }

        .align-items-center {
            align-items: center;
        }

        .mb-4 {
            margin-bottom: 1.5rem;
        }

        .mb-3 {
            margin-bottom: 1rem;
        }

        .mb-0 {
            margin-bottom: 0;
        }

        .text-success {
            color: var(--success-color);
        }

        .text-muted {
            color: #6c757d;
        }

        .fs-5 {
            font-size: 1.25rem;
        }

        .btn-outline-secondary {
            background: transparent;
            border: 1px solid #6c757d;
            color: #6c757d;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .btn-outline-secondary:hover {
            background: #6c757d;
            color: white;
        }

        @media (max-width: 768px) {
            h2 {
                font-size: 1.5rem;
            }

            .container {
                padding: 0;
            }

            .card {
                padding: 15px;
            }

            .row {
                flex-wrap: wrap;
            }

            .col-md-6 {
                flex: 0 0 100%;
            }

            input, button {
                font-size: 16px;
            }
        }
    </style>
</head>

<body>
    <div class="container d-flex justify-content-center align-items-center vh-100">
        <div class="card w-100">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="mb-0">📋 QRCode 產生器</h2>
                <a href="{{ url_for('admin_panel') }}" class="btn btn-outline-secondary">
                    🏠 返回首頁
                </a>
            </div>

            <div class="row">
                <!-- 左側輸入區 -->
                <div class="col-md-6 form-section">
                    <form method="POST" autocomplete="off">
                        <div class="mb-4">
                            <label class="form-label">👤 姓名</label>
                            <input type="text" name="name" class="form-control"
                                   placeholder="請輸入姓名" required autocomplete="off">
                        </div>

                        <div class="mb-4">
                            <label class="form-label">🪪 身分證字號</label>
                            <input type="text" name="id_number" class="form-control"
                                   placeholder="格式：A123456789"
                                   required autocomplete="off"
                                   pattern="^[A-Z]{1}[0-9]{9}$"
                                   maxlength="10"
                                   inputmode="latin"
                                   title="請輸入有效的身分證字號（1 個大寫英文 + 9 位數字）">
                        </div>

                        <button type="submit" class="btn btn-custom w-100">🚀 產生 QRCode</button>
                    </form>

                    {% with messages = get_flashed_messages() %}
                    {% if messages %}
                    <div class="alert alert-warning mt-4">
                        {% for msg in messages %}
                        <p>{{ msg }}</p>
                        {% endfor %}
                    </div>
                    {% endif %}
                    {% endwith %}
                </div>

                <!-- 右側 QR 顯示區 -->
                <div class="col-md-6 qr-area text-center">
                    {% if qr_base64 %}
                    <div>
                        <h5 class="mb-3 text-success">
                            ✅ 已成功產生 <span class="success-name">{{ user_name }}</span> 的 QRCode
                        </h5>
                        <img src="data:image/png;base64,{{ qr_base64 }}" alt="QRCode">
                        <p class="small-note mt-3">右鍵點擊可另存為圖片</p>
                    </div>
                    {% else %}
                    <p class="text-muted fs-5">尚未產生任何 QRCode</p>
                    {% endif %}
                </div>
            </div>
        </div>
    </div>

    <!-- 限制使用者只能輸入英數 -->
    <script>
        const idInput = document.querySelector('input[name="id_number"]');
        idInput.addEventListener('input', (e) => {
            e.target.value = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
        });
    </script>
</body>
</html>
