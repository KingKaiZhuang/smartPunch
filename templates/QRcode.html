<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QRCode 產生器</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        .split-layout {
            display: flex;
            gap: 40px;
        }
        .form-section {
            flex: 1;
            padding-right: 40px;
            border-right: 1px solid var(--apple-border);
        }
        .qr-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 300px;
            text-align: center;
        }
        .qr-image {
            max-width: 260px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            margin: 20px 0;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        @media (max-width: 768px) {
            .split-layout {
                flex-direction: column;
                gap: 20px;
            }
            .form-section {
                border-right: none;
                border-bottom: 1px solid var(--apple-border);
                padding-right: 0;
                padding-bottom: 20px;
            }
        }
    </style>
</head>

<body>
    <!-- Apple Minimalist Navbar -->
    <div class="navbar">
        <a href="{{ url_for('admin_panel') }}" class="navbar-brand">打卡系統</a>
        <div class="navbar-nav">
            <a href="{{ url_for('admin_panel') }}" class="nav-link">返回主頁</a>
        </div>
    </div>

    <div class="container">
        <h1 style="font-size: 32px;">QRCode 產生器</h1>
        <p style="margin-bottom: 30px;">輸入資訊以產生專屬的打卡 QRCode</p>

        <div class="card">
            <div class="split-layout">
                <!-- 左側輸入區 -->
                <div class="form-section">
                    <form method="POST" autocomplete="off">
                        <div class="form-group" style="margin-bottom: 20px;">
                            <label class="form-label">姓名</label>
                            <input type="text" name="name" 
                                   placeholder="請輸入姓名" required autocomplete="off">
                        </div>

                        <div class="form-group" style="margin-bottom: 30px;">
                            <label class="form-label">身分證字號</label>
                            <input type="text" name="id_number" 
                                   placeholder="格式：A123456789"
                                   required autocomplete="off"
                                   pattern="^[A-Z]{1}[0-9]{9}$"
                                   maxlength="10"
                                   inputmode="latin"
                                   title="請輸入有效的身分證字號（1 個大寫英文 + 9 位數字）">
                        </div>

                        <button type="submit" class="btn btn-primary" style="width: 100%; font-size: 16px; padding: 12px;">產生 QRCode</button>
                    </form>

                    {% with messages = get_flashed_messages() %}
                    {% if messages %}
                    <div style="margin-top: 20px;">
                        {% for msg in messages %}
                        <div class="badge" style="display: block; text-align: left; background-color: #fff8e5; color: #b26b00; font-size: 14px; padding: 12px; margin-bottom: 10px; border-left: 4px solid #ffb300;">
                            {{ msg }}
                        </div>
                        {% endfor %}
                    </div>
                    {% endif %}
                    {% endwith %}
                </div>

                <!-- 右側 QR 顯示區 -->
                <div class="qr-area">
                    {% if qr_base64 %}
                    <div>
                        <h3 style="font-size: 18px; color: var(--apple-green); margin-bottom: 15px;">
                            已成功產生 <span style="font-weight: 600;">{{ user_name }}</span> 的 QRCode
                        </h3>
                        <img src="data:image/png;base64,{{ qr_base64 }}" alt="QRCode" class="qr-image">
                        <p style="font-size: 12px; color: var(--apple-text-secondary); margin-top: 10px;">提示：右鍵點擊可另存為圖片</p>
                    </div>
                    {% else %}
                    <div style="color: var(--apple-text-secondary); font-size: 16px;">
                        <div style="font-size: 40px; margin-bottom: 15px; opacity: 0.5;">📱</div>
                        尚未產生任何 QRCode
                    </div>
                    {% endif %}
                </div>
            </div>
        </div>
    </div>

    <!-- 限制使用者只能輸入英數 -->
    <script>
        const idInput = document.querySelector('input[name="id_number"]');
        idInput.addEventListener('input', (e) => {
            e.target.value = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
        });
    </script>
</body>
</html>
